name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:helper
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ClearWeather-Windows-x64
          path: dist/ClearWeather-win32-x64/
