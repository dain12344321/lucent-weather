name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: LucentWeather-Windows-x64
          path: dist/LucentWeather-win32-x64/
          if-no-files-found: error
      - name: Upload staged Windows release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: LucentWeather-Windows-x64-release
          path: dist/LucentWeather-v*-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LucentWeather-Windows-x64-release
          path: release
      - name: Publish GitHub release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          zip="$(find release -maxdepth 2 -type f -name 'LucentWeather-*.zip' -print -quit)"
          test -n "$zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; preserving its assets."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "Lucent Weather $GITHUB_REF_NAME" \
            --generate-notes
