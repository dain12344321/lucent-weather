<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lucent Weather tile</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <link rel="stylesheet" href="dock.css" />
  </head>
  <body>
    <button id="widget" aria-label="Open weather">
      <svg
        id="icon"
        width="28"
        height="28"
        viewBox="0 0 28 28"
        aria-hidden="true"
      >
        <defs>
          <symbol id="sunny" viewBox="0 0 28 28">
            <g stroke="#f8c659" stroke-width="1.7" stroke-linecap="round">
              <path
                d="M14 2v3m0 18v3M2 14h3m18 0h3M5.5 5.5l2.1 2.1m12.8 12.8 2.1 2.1m0-17-2.1 2.1M7.6 20.4l-2.1 2.1"
              />
              <circle cx="14" cy="14" r="6" fill="#ffda72" />
            </g>
          </symbol>
          <symbol id="cloudy" viewBox="0 0 28 28">
            <path
              d="M7 21a5 5 0 0 1-1-9.9A7.5 7.5 0 0 1 20.5 10a5.5 5.5 0 0 1 .5 11Z"
              fill="#d6e0ea"
            />
            <path d="M8 21h13" stroke="#a4b8cc" stroke-width="1.2" />
          </symbol>
          <symbol id="rainy" viewBox="0 0 28 28">
            <path
              d="M7 17a4 4 0 0 1-1-7.8A6.4 6.4 0 0 1 18.5 8a4.5 4.5 0 0 1 2 9Z"
              fill="#c6d5e2"
            />
            <path
              d="m8 21-1 3m7-3-1 3m7-3-1 3"
              stroke="#7fc9f5"
              stroke-width="2"
              stroke-linecap="round"
            />
          </symbol>
          <symbol id="moon" viewBox="0 0 28 28">
            <path
              d="M21 20A10 10 0 0 1 9 5a10 10 0 1 0 12 15Z"
              fill="#e1e5f5"
            />
            <circle cx="21" cy="6" r="1.2" fill="#eee6c8" />
          </symbol>
          <symbol id="snowy" viewBox="0 0 28 28">
            <g stroke="#b6e3ff" stroke-width="1.7" stroke-linecap="round">
              <path
                d="M14 3v22M4.5 8.5l19 11M4.5 19.5l19-11M10.5 5l3.5 3 3.5-3m-7 18 3.5-3 3.5 3M5 12l4.5-.5L8 7m12 14-1.5-4.5L23 16M8 21l1.5-4.5L5 16m18-4-4.5-.5L20 7"
              />
            </g>
          </symbol>
          <symbol id="stormy" viewBox="0 0 28 28">
            <path
              d="M6 17a4 4 0 0 1 0-8 7 7 0 0 1 13-1 5 5 0 0 1 2 9Z"
              fill="#b5c4d5"
            />
            <path d="m14 13-4 8h4l-1 6 7-10h-5l3-4" fill="#ffcd66" />
          </symbol>
          <symbol id="foggy" viewBox="0 0 28 28">
            <path
              d="M4 9h20M2 14h20M6 19h20"
              stroke="#ccd9e0"
              stroke-width="2.5"
              stroke-linecap="round"
            />
          </symbol>
        </defs>
        <use id="weather-glyph" href="#sunny" /></svg
      ><span class="words"
        ><strong id="temp">Weather</strong
        ><span id="detail">Choose your location</span></span
      >
    </button>
    <script src="solar.js"></script>
    <script src="dock.js"></script>
  </body>
</html>
